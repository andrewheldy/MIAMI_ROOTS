# Supabase CLI configuration for Miami Roots local development.
#
# Requires the Supabase CLI + Docker: `npx supabase start`, then
# `npx supabase db reset` to replay ./migrations and ./seed/seed.sql from zero.
# Environments without Docker (CI, cloud sandboxes) use the plain-Postgres
# harness instead: `npm run db:reset` / `npm run db:test` (see ../scripts/db/).
#
# This file contains no secrets — local development keys are generated by the
# CLI at `supabase start` time and are not committed.

project_id = "miami-roots"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
enabled = true
# Local-only URL; per-environment URLs are configured in the hosted projects.
site_url = "http://localhost:3000"

[studio]
enabled = true
port = 54323
